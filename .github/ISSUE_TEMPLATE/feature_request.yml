name: Feature request
description: Suggest REST parity, new helpers, or improvements across SDK, CLI, MCP, or OpenAI tools
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This project mirrors the GitCode REST API in Python and exposes the same capabilities through the SDK, CLI, MCP server, and OpenAI tool adapter.
        Check every integration that should gain the behavior so maintainers can keep them aligned.
        Checking the boxes below adds matching **SDK** / **CLI** / **MCP** / **OpenAI Tool** labels automatically (GitHub Actions).

  - type: checkboxes
    id: usage
    attributes:
      label: How are you using gitcode-api?
      description: Check every path this request should cover.
      options:
        - label: SDK
        - label: CLI
        - label: MCP
        - label: OpenAI Tool

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What you cannot do today, or what is awkward or missing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Desired API shape, CLI flags, tool name, or behavior. Link to upstream GitCode REST docs if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other designs or workarounds you thought about.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Examples, diagrams, or related issues.
