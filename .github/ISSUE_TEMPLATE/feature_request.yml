name: Feature request
description: Suggest REST parity, new helpers, or improvements across SDK, CLI, MCP, or OpenAI tools
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This project wraps the GitCode REST API for Python and also ships a CLI, an MCP server, and an OpenAI-style tool adapter.
        **Only “Problem or use case” is required** — rough ideas for the rest are welcome.
        Checking the boxes under **How are you using gitcode-api?** adds **SDK** / **CLI** / **MCP** / **OpenAI Tool** labels automatically (GitHub Actions).

  - type: checkboxes
    id: usage
    attributes:
      label: How are you using gitcode-api?
      description: Check every path this should affect.
      options:
        - label: SDK
        - label: CLI
        - label: MCP
        - label: OpenAI Tool

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is missing, slow, awkward, or impossible today? Plain language is perfect.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you would like (optional)
      description: Optional. API shape, CLI flags, tool behavior, or links to upstream GitCode REST docs — even a vague direction helps.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds (optional)
      description: Anything you tried or other tools you considered.

  - type: textarea
    id: extra
    attributes:
      label: Additional context (optional)
      description: Screenshots, diagrams, or related issues. You can attach files when you submit.
