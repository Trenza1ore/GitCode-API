# Build PyInstaller one-file CLIs for Linux, macOS, and Windows and attach them to the GitHub Release.
# macos-latest is Apple Silicon (arm64). Add e.g. macos-13 for an Intel macOS build if needed.

name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: windows-latest
          - runner: macos-latest

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group binary

      - name: Build executable
        run: uv run --group binary pyinstaller --clean --noconfirm gitcode-api.spec

      - name: Prepare release asset
        run: |
          set -euxo pipefail
          TAG="${{ github.event.release.tag_name }}"
          case "${{ runner.os }}" in
            Linux)
              SRC="dist/gitcode-api"
              DST="gitcode-api-${TAG}-linux-x86_64"
              ;;
            Windows)
              SRC="dist/gitcode-api.exe"
              DST="gitcode-api-${TAG}-windows-x86_64.exe"
              ;;
            macOS)
              SRC="dist/gitcode-api"
              DST="gitcode-api-${TAG}-macos-arm64"
              ;;
            *)
              echo "unsupported runner.os=${{ runner.os }}" >&2
              exit 1
              ;;
          esac
          cp "$SRC" "$DST"
          echo "ASSET_PATH=$DST" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET_PATH" --clobber
