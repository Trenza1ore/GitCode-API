# Build PyInstaller one-file CLIs, zip each with .claude/ and README files, attach to the GitHub Release.

name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            zip_slug: ubuntu-22.04-x86_64
            dist_name: gitcode-api
          - runner: ubuntu-24.04
            zip_slug: ubuntu-24.04-x86_64
            dist_name: gitcode-api
          - runner: macos-14
            zip_slug: macos-14-arm64
            dist_name: gitcode-api
          - runner: windows-2022
            zip_slug: windows-2022-x86_64
            dist_name: gitcode-api.exe

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group binary

      - name: Build executable
        run: uv run --group binary pyinstaller --clean --noconfirm scripts/gitcode-api.spec

      - name: Build release zip
        run: |
          set -euxo pipefail
          TAG="${{ github.event.release.tag_name }}"
          ZIP="gitcode-api-${TAG}-${{ matrix.zip_slug }}.zip"
          python scripts/package_release_zip.py \
            --binary "dist/${{ matrix.dist_name }}" \
            --zip "$ZIP" \
            --arcname-binary "${{ matrix.dist_name }}"
          echo "ASSET_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET_PATH" --clobber
