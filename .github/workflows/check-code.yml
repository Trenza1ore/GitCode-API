name: Check Code

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ruff
      run: python -m pip install --upgrade pip uv ruff

    - name: Ruff check
      run: uv run python -m ruff check

    - name: Install pytest
      run: uv sync --group test

    - name: Install pytest
      run: uv pip install .

    - name: Run pytest
      run: uv run python -m pytest
